name: Compare imported base with Shopify source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/compare-shopify-source.yml

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare theme files against Shopify source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, hashlib, os

          source = {}
          for manifest in sorted(glob.glob('.sync/source-manifest-*.tsv')):
              with open(manifest, encoding='utf-8') as f:
                  for raw in f:
                      raw = raw.rstrip('\n')
                      if not raw:
                          continue
                      path, md5, size = raw.split('\t')
                      source[path] = (md5, int(size))

          rows = []
          for path, (expected_md5, expected_size) in sorted(source.items()):
              if not os.path.isfile(path):
                  rows.append(('MISSING', path, expected_md5, '-', expected_size, '-'))
                  continue
              data = open(path, 'rb').read()
              actual_md5 = hashlib.md5(data).hexdigest()
              if actual_md5 != expected_md5:
                  rows.append(('CHANGED', path, expected_md5, actual_md5, expected_size, len(data)))

          theme_roots = ('assets','blocks','config','layout','locales','sections','snippets','templates')
          source_paths = set(source)
          for root in theme_roots:
              if not os.path.isdir(root):
                  continue
              for dirpath, _, filenames in os.walk(root):
                  for filename in filenames:
                      path = os.path.join(dirpath, filename).replace(os.sep, '/')
                      if path not in source_paths:
                          rows.append(('EXTRA', path, '-', '-', '-', os.path.getsize(path)))

          with open('.sync/diff-files.tsv', 'w', encoding='utf-8') as out:
              out.write('status\tpath\texpected_md5\tactual_md5\texpected_size\tactual_size\n')
              for row in rows:
                  out.write('\t'.join(map(str, row)) + '\n')

          changed = [r for r in rows if r[0] in ('MISSING','CHANGED')]
          extras = [r for r in rows if r[0] == 'EXTRA']
          with open('.sync/diff-summary.txt', 'w', encoding='utf-8') as out:
              out.write(f'Source files: {len(source)}\n')
              out.write(f'Missing/changed: {len(changed)}\n')
              out.write(f'Extra theme files: {len(extras)}\n')
          print(open('.sync/diff-summary.txt').read())
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sync/diff-files.tsv .sync/diff-summary.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Compare Horizon base with Shopify source"
          git push origin HEAD:main
