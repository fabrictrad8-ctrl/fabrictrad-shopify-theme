name: Verify FabricTrad primary-role preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-auth-fix-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Shopify preview pages
        shell: bash
        env:
          THEME_ID: '163775742170'
        run: |
          set -euo pipefail
          cookie=/tmp/ft-preview-cookie.txt
          fetch_preview() {
            local path="$1" out="$2"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 40 \
              --cookie "$cookie" --cookie-jar "$cookie" \
              -A 'Mozilla/5.0 FabricTradPreviewVerifier/2.2' \
              "https://www.fabrictrad.com${path}?preview_theme_id=${THEME_ID}&pb=0&ft_verify=${GITHUB_RUN_ID}" \
              -o "$out"
          }
          fetch_preview '/pages/login' /tmp/login.html
          fetch_preview '/pages/buyer-dashboard' /tmp/buyer.html
          fetch_preview '/pages/seller-portal' /tmp/seller.html
          echo "Login bytes: $(wc -c < /tmp/login.html)"
          echo "Buyer bytes: $(wc -c < /tmp/buyer.html)"
          echo "Seller bytes: $(wc -c < /tmp/seller.html)"

      - name: Verify Buyer login identity separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q '20260828-primary-role-v1' /tmp/login.html
          grep -q 'separate identity and separate workspace' /tmp/login.html
          grep -q 'Sign in as Buyer' /tmp/login.html

      - name: Verify Buyer route primary-role guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q '2026-08-28-primary-role-v1' /tmp/buyer.html
          grep -q "role==='seller'" /tmp/buyer.html
          grep -q 'fabrictrad-buyer-dashboard' /tmp/buyer.html
          ! grep -q 'Preparing your buyer workspace' /tmp/buyer.html

      - name: Verify Seller Centre primary-role guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q '20260828-primary-role-v1' /tmp/seller.html
          grep -q "role!=='seller'" /tmp/seller.html
          grep -q 'Seller Centre requires a separate Seller account' /tmp/seller.html

      - name: Verify hybrid seller upgrade is absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'request_seller_access' /tmp/seller.html
          ! grep -q 'fabrictrad-seller-onboarding-bridge' /tmp/seller.html

      - name: Verify Shopify origin
        shell: bash
        run: |
          set -euo pipefail
          grep -qi 'cdn.shopify.com' /tmp/buyer.html
          echo 'PASS: Buyer, Seller and Admin entry paths are isolated by primary role; legacy spinner and seller-upgrade bridge are absent.'
