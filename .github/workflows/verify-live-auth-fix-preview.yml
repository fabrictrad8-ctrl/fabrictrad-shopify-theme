name: Verify FabricTrad primary-role preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-auth-fix-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify isolated Buyer and Seller workspaces
        shell: bash
        env:
          THEME_ID: '163775742170'
        run: |
          set -euo pipefail
          cookie=/tmp/ft-preview-cookie.txt
          fetch_preview() {
            local path="$1" out="$2"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 40 \
              --cookie "$cookie" --cookie-jar "$cookie" \
              -A 'Mozilla/5.0 FabricTradPreviewVerifier/2.1' \
              "https://www.fabrictrad.com${path}?preview_theme_id=${THEME_ID}&pb=0&ft_verify=${GITHUB_RUN_ID}" \
              -o "$out"
          }
          fetch_preview '/pages/login' /tmp/login.html
          fetch_preview '/pages/buyer-dashboard' /tmp/buyer.html
          fetch_preview '/pages/seller-portal' /tmp/seller.html
          echo "Login bytes: $(wc -c < /tmp/login.html)"
          echo "Buyer bytes: $(wc -c < /tmp/buyer.html)"
          echo "Seller bytes: $(wc -c < /tmp/seller.html)"

          grep -q '20260828-primary-role-v1' /tmp/login.html || { echo '::error::Buyer login is not using primary-role routing.'; exit 1; }
          grep -q 'separate identity and separate workspace' /tmp/login.html || { echo '::error::Buyer login does not declare separate Buyer and Seller identities.'; exit 1; }
          grep -q '2026-08-28-primary-role-v1' /tmp/buyer.html || { echo '::error::Buyer routes are not protected by the primary-role auth router.'; exit 1; }
          grep -q "role==='seller'" /tmp/buyer.html || { echo '::error::Buyer guard does not explicitly route primary sellers away.'; exit 1; }
          if grep -q 'Preparing your buyer workspace' /tmp/buyer.html; then echo '::error::Legacy infinite buyer-workspace spinner is still present.'; exit 1; fi
          grep -q 'fabrictrad-buyer-dashboard' /tmp/buyer.html || { echo '::error::Current Buyer Dashboard was not rendered.'; exit 1; }

          grep -q '20260828-primary-role-v1' /tmp/seller.html || { echo '::error::Seller Centre is not using the strict Seller guard.'; exit 1; }
          grep -q "role!=='seller'" /tmp/seller.html || { echo '::error::Seller Centre does not require primary role seller.'; exit 1; }
          grep -q 'Seller Centre requires a separate Seller account' /tmp/seller.html || { echo '::error::Seller Centre does not reject Buyer identities explicitly.'; exit 1; }
          if grep -q 'request_seller_access' /tmp/seller.html; then echo '::error::Hybrid buyer-to-seller upgrade bridge is still rendered.'; exit 1; fi
          if grep -q 'fabrictrad-seller-onboarding-bridge' /tmp/seller.html; then echo '::error::Hybrid seller onboarding bridge section is still mounted.'; exit 1; fi
          grep -qi 'cdn.shopify.com' /tmp/buyer.html || { echo '::error::Preview was not served by Shopify.'; exit 1; }

          echo 'PASS: primary Buyer and Seller workspaces are isolated; legacy spinner and seller-upgrade bridge are absent.'
