name: Split Shopify theme diff

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/split-diff.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split diff by theme folder
        shell: bash
        run: |
          set -euo pipefail
          for root in assets blocks config layout locales sections snippets templates; do
            awk -F '\t' -v r="$root/" 'NR>1 && index($2,r)==1 {print $1 "\t" $2}' .sync/diff-files.tsv > ".sync/diff-${root}.tsv"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sync/diff-*.tsv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Split Shopify theme parity diff by folder"
          git push origin HEAD:main
